# CI — lint, test, typecheck, build, and production verification on this temporary branch.
# Does NOT deploy. The deploy.yml workflow handles production deploys on push to main.

name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .github/gitleaks.toml

  verify:
    name: Lint + test + typecheck + build + production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Agent-readiness contract tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build (Next.js)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify current production agent surfaces
        run: node scripts/verify-agent-readiness.mjs
        env:
          BASE_URL: https://sigeconomy.com
          STRICT_MCP_HANDSHAKE: "0"
