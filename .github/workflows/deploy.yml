# Deploy sigeconomy.com to Cloudflare Workers on push to main.
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Verify + build + deploy + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Agent-readiness contract tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build (OpenNext for Cloudflare)
        run: npx opennextjs-cloudflare build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production agent surfaces
        run: node scripts/verify-agent-readiness.mjs
        env:
          BASE_URL: https://sigeconomy.com
          # The MCP server lives in a separate Supabase Edge Function. Its
          # handshake is always probed and reported, but does not block this
          # site's deployment unless the infrastructure owner opts into strict mode.
=======
          STRICT_MCP_HANDSHAKE: "0"
