standard:
  name: ello-repo-standard
  version: "1.0.0"
  mode: migrate

repo:
  name: sigarena
  type: product
  lifecycle: active
  repo_id: sigarena
  family: sigrank
  purpose: SigArena — satellite leaderboard site at sigeconomy.com. Read-only Next.js app deployed to Cloudflare Workers. Data sourced from signalaf.com public API.

structure:
  profile: product
  allowed_root_dirs_extra: [app, components, lib, system-devin]
  allowed_root_files_extra: [.env.example, cloudflare-globals.d.ts, middleware.ts, open-next.config.ts, postcss.config.mjs, tailwind.config.ts, wrangler.toml]
  document_roots: [docs]
  artifact_roots: [artifacts]
  archive_roots: [archive, docs/archive]

naming:
  forbid_version_suffixes: true
  forbidden_suffixes: [_final, _final2, _new, _updated, _revised, _copy]

knowledge:
  okf_enabled: true
  okf_roots: [docs, .coord]
  okf_severity: warn

coordination:
  micro_enabled: true
  micro_root: .coord/micro
  macro_enabled: true
  macro_root: .coord/macro

github:
  ruleset_profile: solo-fast
  required_check: repo-standard
